
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Learning Style Explorer</title>

    <!-- Shared styles -->
    <link rel="stylesheet" href="../shared/iphone-frame/iphone-frame.css">
    <link rel="stylesheet" href="../shared/status-bar/status-bar.css">
    <link rel="stylesheet" href="../shared/bottom-nav/bottom-nav.css">
    <link rel="stylesheet" href="../shared/themes/themes.css">
    <link rel="stylesheet" href="../shared/brand/brand.css">
    <link rel="stylesheet" href="../shared/button/button.css">
    <link rel="stylesheet" href="../shared/form-field/form-field.css">
    <link rel="stylesheet" href="forgot-password.css">

    <!-- Shared components -->
    <script src="../shared/brand/brand.js" defer></script>
    <script src="../shared/form-field/form-field.js" defer></script>
</head>

<body data-theme="summer-drift">
    <main class="app-container">
        <div id="status-bar"></div>

        <div class="forgot-password-content">

            <!-- Header -->
            <header class="forgot-password-header">
                <app-brand></app-brand>

                <button
                    type="button"
                    class="btn btn-mini-back btn-icon-mini-back">
                    Back
                </button>
            </header>

            <!-- Password reset card -->
            <section class="forgot-password-card">

                <!-- Illustrations -->
                <div class="forgot-password-illustrations" aria-hidden="true">
                    <img
                        class="person-password"
                        src="assets/person-password.svg"
                        alt=""
                    >

                    <img
                        class="decorative-squares-forgot-password"
                        src="assets/decorative-squares-forgot-password.svg"
                        alt=""
                    >

                    <img
                        class="decorative-squares-small-forgot-password"
                        src="assets/decorative-squares-small-forgot-password.svg"
                        alt=""
                    >

                    <img
                        class="decorative-circle-forgot-password"
                        src="assets/decorative-circle-forgot-password.svg"
                        alt=""
                    >
                </div>

                <!-- Card text -->
                <div class="forgot-password-text">
                    <p class="reset-label">RESET PASSWORD</p>

                    <h1 class="reset-heading">
                        Forgot your<br>
                        <span>password?</span>
                    </h1>

                    <p class="reset-description">
                        No worries — enter your email<br>
                        and we will send a reset link
                    </p>

                    <p class="reset-instruction">
                        then create a new password below
                    </p>
                </div>
            </section>

            <!-- Reset steps -->
            <div class="reset-steps" aria-label="Password reset progress">
                <div class="reset-step">1 · Verify Email</div>
                <div class="reset-step">2 · New Password</div>
                <div class="reset-step">3 · Done</div>
            </div>

            <!-- Email reset form -->
            <form class="reset-email-form">

                <!-- Email -->
                <div class="form-field">
                    <label class="field-heading" for="reset-email">
                        Email Address
                    </label>

                    <div class="field-control">
                        <input
                            class="field-input"
                            id="reset-email"
                            type="email"
                            name="email"
                            placeholder=" "
                            autocomplete="email"
                            required
                        >

                        <label class="field-floating-label" for="reset-email">
                            Enter your email address
                        </label>
                    </div>
                </div>

                <!-- Send reset link -->
                <button
                    type="button"
                    class="btn btn-large btn-primary btn-icon-large send-reset">
                    Send Reset Link
                </button>
            </form>

            <!-- Divider -->
            <div class="reset-divider" aria-hidden="true"></div>

            <!-- New password form -->
            <form class="reset-password-form">

                <!-- New password -->
                <div class="form-field new-password">
                    <label class="field-heading" for="reset-new-password">
                        New Password
                    </label>

                    <div class="field-control">
                        <input
                            class="field-input"
                            id="reset-new-password"
                            type="password"
                            name="new-password"
                            placeholder=" "
                            autocomplete="new-password"
                            required
                        >

                        <label
                            class="field-floating-label"
                            for="reset-new-password">
                            Create a new password
                        </label>
                    </div>
                </div>

                <!-- Confirm password -->
                <div class="form-field confirm-password">
                    <label class="field-heading" for="reset-confirm-password">
                        Confirm Password
                    </label>

                    <div class="field-control">
                        <input
                            class="field-input"
                            id="reset-confirm-password"
                            type="password"
                            name="confirm-password"
                            placeholder=" "
                            autocomplete="new-password"
                            required
                        >

                        <label
                            class="field-floating-label"
                            for="reset-confirm-password">
                            Confirm your new password
                        </label>
                    </div>
                </div>

                <!-- Reset password -->
                <button
                    type="button"
                    class="btn btn-large btn-secondary btn-icon-large save-password">
                    Reset Password
                </button>
            </form>

            <!-- Back to login -->
            <div class="back-to-login">
                <p>Remember your password?</p>

                <a href="../login/login.html" class="forgot-password-link">
                    Back to Login
                </a>
            </div>

        </div>

        <div id="bottom-nav"></div>
    </main>

    <!-- Shared scripts -->
    <script src="../shared/status-bar/status-bar.js"></script>
    <script src="../shared/bottom-nav/bottom-nav.js"></script>
    <script src="forgot-password.js"></script>
</body>
</html>
