
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Style Explorer</title>

    <!-- Shared styles -->
    <link rel="stylesheet" href="../shared/iphone-frame/iphone-frame.css">
    <link rel="stylesheet" href="../shared/status-bar/status-bar.css">
    <link rel="stylesheet" href="../shared/bottom-nav/bottom-nav.css">
    <link rel="stylesheet" href="../shared/themes/themes.css">
    <link rel="stylesheet" href="../shared/brand/brand.css">
    <link rel="stylesheet" href="../shared/button/button.css">
    <link rel="stylesheet" href="../shared/card/card.css">
    <link rel="stylesheet" href="home.css">

    <!-- Shared components -->
    <script src="../shared/brand/brand.js" defer></script>
    <script src="../shared/button/button.js" defer></script>
    <script src="../shared/card/card.js" defer></script>
</head>

<body data-theme="summer-drift">
    <main class="app-container">
        <div id="status-bar"></div>

        <div class="home-content">

            <!-- Header -->
            <header class="home-header">
                <app-brand></app-brand>

                <app-button
                    type="login"
                    text="Login"
                    action="open-login">
                </app-button>
            </header>

            <!-- Hero card -->
            <section class="hero-card">

                <!-- Illustrations -->
                <div class="hero-illustrations" aria-hidden="true">
                    <img
                        class="decorative-squares"
                        src="assets/decorative-squares.svg"
                        alt=""
                    >

                    <img
                        class="graduation-girl"
                        src="assets/graduation-girl.svg"
                        alt=""
                    >

                    <img
                        class="decorative-squares-small"
                        src="assets/decorative-squares-small.svg"
                        alt=""
                    >

                    <img
                        class="decorative-circles"
                        src="assets/decorative-circles.svg"
                        alt=""
                    >
                </div>

                <!-- Hero text -->
                <div class="hero-content">
                    <div class="vark-label">
                        <span>VARK QUIZ APP</span>
                    </div>

                    <div class="hero-heading">
                        <h1 class="hero-title">Discover Your</h1>
                        <h2 class="hero-title-second">Learning Style</h2>
                    </div>

                    <p class="hero-description">
                        Find out how you learn best in minutes<br>
                        and get personalised study tips
                    </p>
                </div>
            </section>

            <!-- Learning styles -->
            <section class="learning-styles-section">
                <div class="home-divider" aria-hidden="true"></div>

                <h2 class="learning-styles-title">
                    Learning Styles
                </h2>

                <div class="learning-styles">
                    <span class="style-pill visual">Visual</span>
                    <span class="style-pill auditory">Auditory</span>
                    <span class="style-pill read-write">Read/Write</span>
                    <span class="style-pill kinesthetic">Kinesthetic</span>
                </div>
            </section>

            <!-- How it works -->
            <section class="how-it-works-section">
                <div class="home-divider-second" aria-hidden="true"></div>

                <h2 class="how-it-works-title">
                    How it works
                </h2>

                <div class="how-steps">

                    <!-- Step 1 -->
                    <app-card
                        number="1"
                        heading="Answer 12 quick questions"
                        description="About your habits and learning preferences"
                        accent-color="#E07A5F"
                        bg="#F4F1DE"
                        circle-bg="#E07A5F26"
                        number-color="#E07A5F"
                        heading-color="#3D405B"
                        description-color="#AFAFAF">
                    </app-card>

                    <!-- Step 2 -->
                    <app-card
                        number="2"
                        heading="Get your VARK result"
                        description="See your personalised learning style breakdown"
                        accent-color="#81B29A"
                        bg="#F4F1DE"
                        circle-bg="#81B29A26"
                        number-color="#81B29A"
                        heading-color="#3D405B"
                        description-color="#AFAFAF">
                    </app-card>

                    <!-- Step 3 -->
                    <app-card
                        number="3"
                        heading="Study smarter with personalised tips"
                        description="Strategies tailored to your learning style"
                        accent-color="#F2CC8F"
                        bg="#F4F1DE"
                        circle-bg="#F2CC8F26"
                        number-color="#3D405B"
                        heading-color="#3D405B"
                        description-color="#AFAFAF">
                    </app-card>

                </div>
            </section>

            <!-- Get Started -->
            <section class="get-started-section">
                <div class="home-divider-third" aria-hidden="true"></div>

                <app-button
                    type="large"
                    variant="primary"
                    text="Get Started"
                    action="start-quiz">
                </app-button>

                <!-- Account -->
                <div class="account-section">
                    <p class="account-prompt">Don’t have an account?</p>
                    <a class="signup-link" href="../signup/signup.html">
                        Sign Up Free
                    </a>
                </div>
            </section>

        </div>

        <div id="bottom-nav"></div>
    </main>

    <!-- Shared scripts -->
    <script src="../shared/status-bar/status-bar.js"></script>
    <script src="../shared/bottom-nav/bottom-nav.js"></script>
    <script src="home.js"></script>
</body>
</html>
