
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Learning Style Explorer</title>

    <!-- Shared styles -->
    <link rel="stylesheet" href="../shared/iphone-frame/iphone-frame.css">
    <link rel="stylesheet" href="../shared/status-bar/status-bar.css">
    <link rel="stylesheet" href="../shared/bottom-nav/bottom-nav.css">
    <link rel="stylesheet" href="../shared/themes/themes.css">
    <link rel="stylesheet" href="../shared/brand/brand.css">
    <link rel="stylesheet" href="../shared/button/button.css">
    <link rel="stylesheet" href="../shared/form-field/form-field.css">
    <link rel="stylesheet" href="login.css">

    <!-- Shared components -->
    <script src="../shared/brand/brand.js" defer></script>
    <script src="../shared/form-field/form-field.js" defer></script>
</head>

<body data-theme="summer-drift">
    <main class="app-container">
        <div id="status-bar"></div>

        <div class="login-content">

            <!-- Header -->
            <header class="login-header">
                <app-brand></app-brand>

                <button
                    type="button"
                    class="btn btn-mini-back btn-icon-mini-back">
                    Back
                </button>
            </header>

            <!-- Welcome card -->
            <section class="login-card">
                <div class="welcome-content">
                    <p class="welcome-label">WELCOME BACK</p>

                    <h1 class="welcome-heading">
                        Login to your<br>
                        <span>account</span>
                    </h1>

                    <p class="welcome-description">
                        Please enter your details<br>
                        below to continue
                    </p>
                </div>
            </section>

            <!-- Illustrations -->
            <div class="login-illustrations" aria-hidden="true">
                <img
                    class="girl-window-tree"
                    src="assets/girl-window-tree.svg"
                    alt=""
                >

                <img
                    class="decorative-squares-login"
                    src="assets/decorative-squares-login.svg"
                    alt=""
                >

                <img
                    class="decorative-squares-small-login"
                    src="assets/decorative-squares-small-login.svg"
                    alt=""
                >
            </div>

            <!-- Login form -->
            <form class="login-form">

                <!-- Fields -->
                <div class="login-fields">

                    <!-- Email -->
                    <div class="form-field">
                        <label class="field-heading" for="login-email">
                            Email Address
                        </label>

                        <div class="field-control">
                            <input
                                class="field-input"
                                id="login-email"
                                type="email"
                                name="email"
                                placeholder=" "
                                autocomplete="email"
                            >

                            <label
                                class="field-floating-label"
                                for="login-email">
                                Enter your email address
                            </label>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-field">
                        <label class="field-heading" for="login-password">
                            Password
                        </label>

                        <div class="field-control">
                            <input
                                class="field-input"
                                id="login-password"
                                type="password"
                                name="password"
                                placeholder=" "
                                autocomplete="current-password"
                            >

                            <label
                                class="field-floating-label"
                                for="login-password">
                                Enter your password
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Forgot password -->
                <div class="login-forgot-password">
                    <a
                        href="../forgot-password/forgot-password.html"
                        class="login-link forgot-password-link">
                        Forgot Password?
                    </a>
                </div>

                <!-- Login button -->
                <button
                    type="button"
                    class="btn btn-large btn-primary btn-icon-large login-submit">
                    Login
                </button>

            </form>

            <!-- Divider -->
            <div class="login-divider">
                <span class="login-divider-line" aria-hidden="true"></span>
                <span class="login-divider-text">or continue with</span>
                <span class="login-divider-line" aria-hidden="true"></span>
            </div>

            <!-- Google button -->
            <button
                type="button"
                class="btn btn-google login-google">
                Continue with Google
            </button>

            <!-- Sign up -->
            <div class="login-signup">
                <p class="login-signup-prompt">Don’t have an account?</p>

                <a
                    href="../signup/signup.html"
                    class="login-link login-signup-link">
                    Sign Up Free
                </a>
            </div>

        </div>

        <div id="bottom-nav"></div>
    </main>

    <!-- Shared scripts -->
    <script src="../shared/status-bar/status-bar.js"></script>
    <script src="../shared/bottom-nav/bottom-nav.js"></script>
    <script src="login.js"></script>
</body>
</html>
