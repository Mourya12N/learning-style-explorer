
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Learning Style Explorer</title>

    <!-- Shared styles -->
    <link rel="stylesheet" href="../shared/iphone-frame/iphone-frame.css">
    <link rel="stylesheet" href="../shared/status-bar/status-bar.css">
    <link rel="stylesheet" href="../shared/bottom-nav/bottom-nav.css">
    <link rel="stylesheet" href="../shared/themes/themes.css">
    <link rel="stylesheet" href="../shared/brand/brand.css">
    <link rel="stylesheet" href="../shared/button/button.css">
    <link rel="stylesheet" href="../shared/form-field/form-field.css">
    <link rel="stylesheet" href="../shared/dropdown/dropdown.css">

    <!-- Page styles -->
    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet" href="signup-validation.css">

    <!-- Shared components -->
    <script src="../shared/brand/brand.js" defer></script>
    <script src="../shared/form-field/form-field.js" defer></script>
</head>

<body data-theme="summer-drift">
    <script src="../shared/themes/themes.js"></script>

    <main class="app-container">
        <div id="status-bar"></div>

        <div class="signup-content">

            <!-- Header -->
            <header class="signup-header">
                <app-brand></app-brand>

                <button
                    type="button"
                    class="btn btn-mini-back btn-icon-mini-back">
                    Back
                </button>
            </header>

            <!-- Welcome card -->
            <section class="signup-card">
                <div class="signup-welcome">
                    <p class="signup-label">CREATE ACCOUNT</p>

                    <h1 class="signup-heading">
                        Join Learning<br>
                        <span>Style Explorer</span>
                    </h1>

                    <p class="signup-description">
                        Create your free account today<br>
                        and discover how you learn
                    </p>
                </div>
            </section>

            <!-- Illustrations -->
            <div class="signup-illustrations" aria-hidden="true">
                <img
                    class="person-rocket"
                    src="assets/person-rocket.svg"
                    alt=""
                >

                <img
                    class="decorative-squares-signup"
                    src="assets/decorative-squares-signup.svg"
                    alt=""
                >

                <img
                    class="decorative-squares-small-signup"
                    src="assets/decorative-squares-small-signup.svg"
                    alt=""
                >
            </div>

            <!-- Signup form -->
            <form class="signup-form">

                <!-- Form fields -->
                <div class="signup-fields">

                    <!-- Full name -->
                    <div class="form-field" data-icon="person">
                        <label class="field-heading" for="signup-name">
                            Full Name
                        </label>

                        <div class="field-control">
                            <input
                                class="field-input"
                                id="signup-name"
                                type="text"
                                name="full-name"
                                placeholder=" "
                                autocomplete="name"
                                required
                            >

                            <label class="field-floating-label" for="signup-name">
                                Enter your full name
                            </label>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="form-field">
                        <label class="field-heading" for="signup-email">
                            Email Address
                        </label>

                        <div class="field-control">
                            <input
                                class="field-input"
                                id="signup-email"
                                type="email"
                                name="email"
                                placeholder=" "
                                autocomplete="email"
                                required
                            >

                            <label class="field-floating-label" for="signup-email">
                                Enter your email address
                            </label>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-field">
                        <label class="field-heading" for="signup-password">
                            Password
                        </label>

                        <div class="field-control">
                            <input
                                class="field-input"
                                id="signup-password"
                                type="password"
                                name="password"
                                placeholder=" "
                                autocomplete="new-password"
                                required
                            >

                            <label class="field-floating-label" for="signup-password">
                                Create a password
                            </label>
                        </div>
                    </div>

                    <!-- Confirm password -->
                    <div class="form-field">
                        <label class="field-heading" for="signup-confirm">
                            Confirm Password
                        </label>

                        <div class="field-control">
                            <input
                                class="field-input"
                                id="signup-confirm"
                                type="password"
                                name="confirm-password"
                                placeholder=" "
                                autocomplete="new-password"
                                required
                            >

                            <label class="field-floating-label" for="signup-confirm">
                                Confirm your password
                            </label>
                        </div>
                    </div>

                    <!-- Role dropdown -->
                    <div class="dropdown">
                        <label class="dropdown-heading" for="user-role">
                            Your Role
                        </label>

                        <div class="dropdown-control">
                            <select
                                class="dropdown-select"
                                id="user-role"
                                name="user-role"
                                required
                            >
                                <option value="" disabled selected hidden>
                                    Select your role
                                </option>

                                <option value="High School Student">
                                    High School Student
                                </option>

                                <option value="University Student">
                                    University Student
                                </option>

                                <option value="Teacher / Tutor">
                                    Teacher / Tutor
                                </option>

                                <option value="Parent">
                                    Parent
                                </option>
                            </select>

                            <!-- Dropdown triangle -->
                            <svg
                                class="dropdown-triangle"
                                viewBox="0 0 12 12"
                                aria-hidden="true">
                                <path d="M0.8 1H11.2L6 10Z"></path>
                            </svg>

                            <!-- Student icon -->
                            <span class="dropdown-icon">
                                <svg viewBox="0 0 14 17" aria-hidden="true">
                                    <path d="M13.3313 3.03225C13.332 2.45559 12.9813 1.95892 12.438 1.76692L8.128 0.246253C7.20267 -0.0810802 6.184 -0.0817469 5.25933 0.242253L0.897333 1.76892C0.352 1.95959 0 2.45559 0 3.03292C0 3.61092 0.352667 4.10692 0.898 4.29692L2.662 4.91225V6.03359L5.236 5.81025C5.69533 5.97025 6.17867 6.05092 6.66133 6.05092C7.144 6.05092 7.62667 5.97025 8.086 5.81025L9.32867 5.37692V6.03292V6.03359ZM7.64733 4.55159C7.012 4.77359 6.31133 4.77359 5.676 4.55159L1.338 3.02692L5.70067 1.50025C6.01933 1.38892 6.35333 1.33292 6.68867 1.33292C7.026 1.33292 7.36333 1.38959 7.68467 1.50292L11.9947 3.03492L7.64733 4.55159Z"></path>
                                </svg>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Terms agreement -->
                <div class="signup-agreement" id="signup-agreement">
                    <p
                        class="signup-agreement-error"
                        id="signup-agreement-error"
                        role="alert"
                        hidden>
                        *You must accept the Terms &amp; Conditions*
                    </p>

                    <span class="signup-agreement-text">
                        Please read and accept the
                        <a href="../tos-eula/tos-eula.html" class="signup-link">
                            Terms &amp; Conditions
                        </a>
                        to continue.
                    </span>
                </div>

                <!-- Create account -->
                <button
                    type="button"
                    class="btn btn-large btn-primary btn-icon-large signup-submit">
                    Create Account
                </button>
            </form>

            <!-- Login link -->
            <div class="signup-login">
                <p class="signup-login-prompt">
                    Already have an account?
                </p>

                <a href="../login/login.html" class="signup-link">
                    Login
                </a>
            </div>
        </div>

        <div id="bottom-nav"></div>
    </main>

    <!-- Shared scripts -->
    <script src="../shared/status-bar/status-bar.js"></script>
    <script src="../shared/bottom-nav/bottom-nav.js"></script>

    <!-- Page script -->
    <script src="signup.js"></script>
</body>
</html>
