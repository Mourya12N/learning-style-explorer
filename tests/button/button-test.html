
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Test</title>

    <link rel="stylesheet" href="../../shared/iphone-frame/iphone-frame.css">
    <link rel="stylesheet" href="../../shared/button/button.css">

    <script src="../../shared/button/button.js" defer></script>

    <style>
        /* Test layout */
        .test-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 24px;
            width: 100%;
            box-sizing: border-box;
            padding: 53px 17px 40px;
        }

        .button-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
        }
    </style>
</head>

<body>
    <main class="app-container">
        <div class="test-content">

            <!-- Large -->
            <app-button
                type="large"
                text="Lorem"
                bg="#B8B8B8"
                hover="#A0A0A0"
                text-color="#FFFFFF"
                icon-color="#FFFFFF">
            </app-button>

            <!-- Next and Back -->
            <div class="button-row">
                <app-button
                    type="next"
                    text="Lorem"
                    bg="#B8B8B8"
                    hover="#A0A0A0"
                    text-color="#FFFFFF"
                    icon-color="#FFFFFF">
                </app-button>

                <app-button
                    type="back"
                    text="Lorem"
                    bg="#B8B8B8"
                    hover="#A0A0A0"
                    text-color="#FFFFFF"
                    icon-color="#FFFFFF">
                </app-button>
            </div>

            <!-- Accept and Decline -->
            <div class="button-row">
                <app-button
                    type="accept"
                    text="Lorem"
                    bg="#B8B8B8"
                    hover="#A0A0A0"
                    text-color="#FFFFFF"
                    icon-color="#FFFFFF">
                </app-button>

                <app-button
                    type="decline"
                    text="Lorem"
                    bg="#B8B8B8"
                    hover="#A0A0A0"
                    text-color="#FFFFFF"
                    icon-color="#FFFFFF">
                </app-button>
            </div>

            <!-- Save and Share -->
            <div class="button-row">
                <app-button
                    type="save"
                    text="Lorem"
                    bg="#B8B8B8"
                    hover="#A0A0A0"
                    text-color="#FFFFFF"
                    icon-color="#FFFFFF">
                </app-button>

                <app-button
                    type="share"
                    text="Lorem"
                    bg="#B8B8B8"
                    hover="#A0A0A0"
                    text-color="#FFFFFF"
                    icon-color="#FFFFFF">
                </app-button>
            </div>

            <!-- Retake -->
            <app-button
                type="retake"
                text="Lorem"
                bg="#B8B8B8"
                hover="#A0A0A0"
                text-color="#FFFFFF"
                icon-color="#FFFFFF">
            </app-button>

            <!-- Mini Back -->
            <app-button
                type="mini-back"
                text="Lorem"
                bg="#B8B8B8"
                hover="#A0A0A0"
                text-color="#FFFFFF"
                icon-color="#FFFFFF">
            </app-button>

            <!-- Login -->
            <app-button
                type="login"
                text="Lorem"
                bg="transparent"
                hover="#E5E5E5"
                text-color="#B8B8B8"
                border-color="#B8B8B8">
            </app-button>

            <!-- Login with Google -->
            <app-button
                type="google"
                text="Lorem"
                bg="transparent"
                hover="#E5E5E5"
                text-color="#B8B8B8"
                border-color="#B8B8B8">
            </app-button>

        </div>
    </main>
</body>
</html>
