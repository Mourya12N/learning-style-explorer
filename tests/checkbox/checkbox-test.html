
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkbox Test</title>

    <link
        rel="stylesheet"
        href="../../shared/iphone-frame/iphone-frame.css"
    >

    <link
        rel="stylesheet"
        href="../../shared/checkbox/checkbox.css"
    >

    <link rel="stylesheet" href="checkbox-test.css">

    <script
        src="../../shared/checkbox/checkbox.js"
        defer>
    </script>
</head>

<body>
    <main class="app-container">
        <div class="checkbox-test-content">

            <h1>Checkbox Test</h1>

            <app-checkbox
                label="I agree to the Terms and Conditions"
                name="agree"
                value="yes"
                bg="#E5E5E5"
                hover-bg="#D0D0D0"
                outline-color="#000000"
                hover-outline-color="#222222"
                text-color="#000000">
            </app-checkbox>

        </div>
    </main>
</body>
</html>
