
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dropdown Test</title>

    <link
        rel="stylesheet"
        href="../../shared/iphone-frame/iphone-frame.css"
    >

    <link
        rel="stylesheet"
        href="../../shared/dropdown/dropdown.css"
    >

    <link
        rel="stylesheet"
        href="form-field-test.css"
    >

    <script
        src="../../shared/dropdown/dropdown.js"
        defer>
    </script>
</head>

<body>
    <main class="app-container">
        <div class="form-test-content">

            <h1 class="form-test-title">
                Dropdown Test
            </h1>

            <div class="form-test-fields">

                <app-dropdown
                    heading="Your Role"
                    label="Select your role"
                    name="dropdown-test"
                    options="High School Student|University Student|Teacher / Tutor|Parent"
                    bg="#F4F1DE"
                    hover="#D5D2BA"
                    border-color="#3D405BCC"
                    heading-color="#3D405B"
                    label-color="#B4B3B0"
                    text-color="#3D405B"
                    icon-color="#81B29A"
                    arrow-color="#B4B3B0"
                    option-bg="#F4F1DE"
                    option-hover="#D5D2BA"
                    option-text-color="#B4B3B0"
                    selected-color="#777777">
                </app-dropdown>

            </div>

        </div>
    </main>
</body>
</html>
